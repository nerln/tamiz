<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 218 64" role="img" aria-label="Tamiz">
  <title>Tamiz</title>
  <!-- Scritta Tamiz: la T è la figura del logo (testa ocra, braccia e asta terracotta); amiz è disegnato con
       lo stesso spessore (10) e terminazioni tonde, a tratti, senza font di sistema. Tema scuro in media query. -->
  <style>
    .tm-cabeza { fill: #B06A10; }
    .tm-cuerpo { fill: #A3401C; }
    .tm-brazos { fill: none; stroke: #A3401C; stroke-width: 10; stroke-linecap: round; }
    .tm-letra { fill: none; stroke: #3B2A20; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .tm-cabeza { fill: #E9B45A; }
      .tm-cuerpo { fill: #F0956D; }
      .tm-brazos { stroke: #F0956D; }
      .tm-letra { stroke: #F3EBE2; }
    }
  </style>
  <circle class="tm-cabeza" cx="32" cy="11" r="7.6"/>
  <path class="tm-brazos" d="M5 21 C9.5 25.5 18 27 32 27 C46 27 54.5 25.5 59 21"/>
  <path class="tm-cuerpo" d="M26.75 27 H37.25 L36.5 57.5 A4.5 4.5 0 0 1 27.5 57.5 Z"/>
  <g class="tm-letra">
    <circle cx="88.75" cy="40.75" r="11.75"/>
    <path d="M100.5 29 V52.5"/>
    <path d="M115.5 52.5 V40.75 A11.75 11.75 0 0 1 139 40.75 V52.5 M139 40.75 A11.75 11.75 0 0 1 162.5 40.75 V52.5"/>
    <path d="M177.5 29 V52.5"/>
    <path d="M192.5 29 H212.5 L192.5 52.5 H212.5"/>
  </g>
  <circle class="tm-cabeza" cx="177.5" cy="11" r="7.6"/>
</svg>
